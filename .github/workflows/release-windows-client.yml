name: Release Windows client (Velopack)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without v (example: 1.0.1)'
        required: true
      channel:
        description: 'Release channel'
        type: choice
        options: [stable, beta]
        default: beta

# The legacy bridge remains GitHub's latest release forever. Modern clients
# read only the private update-feed release below, never /releases/latest.
permissions:
  contents: write

env:
  VELOPACK_VERSION: '1.2.0'
  PACK_ID: Tupi.Client
  UPDATE_FEED_TAG: tupi-update-feed

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_name != 'v0.1.999'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid SemVer: $version" }
          $channel = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.channel }}' } elseif ($version -match '-') { 'beta' } else { 'stable' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "velopack_channel=win-x64-$channel" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/ui/package-lock.json

      - name: Build web interface
        working-directory: client/ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          # The publisher/Velopack tooling uses the current SDK, while the
          # desktop app and its testhost still target net6. Installing both
          # supplies Microsoft.NETCore.App 6.x on windows-latest.
          dotnet-version: |
            8.0.x
            6.0.x

      - name: Test native client
        run: dotnet test client/native/Talkeando.Client.Tests/Talkeando.Client.Tests.csproj --configuration Release

      - name: Publish application payload
        shell: pwsh
        run: |
          dotnet publish client/native/Talkeando.Client/Talkeando.Client.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version="${{ steps.release.outputs.version }}" -p:AssemblyVersion="${{ steps.release.outputs.version }}.0" -p:FileVersion="${{ steps.release.outputs.version }}.0" -p:InformationalVersion="${{ steps.release.outputs.version }}+${{ github.sha }}" --output release/Tupi-win-x64

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version $env:VELOPACK_VERSION

      - name: Restore current update feed for delta packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release/velopack | Out-Null
          # PowerShell's try/catch does not catch a non-zero exit code from
          # `gh`. The first Velopack release has no feed to download yet, so
          # detect it explicitly and let the following package step create it.
          gh release view $env:UPDATE_FEED_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'The update feed does not exist yet; creating its first package.'
            exit 0
          }
          gh release download $env:UPDATE_FEED_TAG --dir release/velopack --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the existing Velopack update feed.' }

      - name: Package Velopack release
        shell: pwsh
        run: |
          @"
          # Tupi ${{ steps.release.outputs.version }}

          Canal: ${{ steps.release.outputs.channel }}
          Commit: ${{ github.sha }}
          "@ | Set-Content release/release-notes.md
          $fullPackage = Join-Path release/velopack "$env:PACK_ID-${{ steps.release.outputs.version }}-${{ steps.release.outputs.velopack_channel }}-full.nupkg"
          if (Test-Path -LiteralPath $fullPackage) {
            # A previous attempt may have published the immutable feed and
            # failed only while creating the human-facing GitHub release.
            # Velopack forbids repacking the same version, so reuse that
            # byte-identical package on a workflow retry.
            Write-Host "Reusing existing package $fullPackage"
          } else {
            vpk pack --packId $env:PACK_ID --packVersion "${{ steps.release.outputs.version }}" --packDir release/Tupi-win-x64 --mainExe Tupi.exe --outputDir release/velopack --channel "${{ steps.release.outputs.velopack_channel }}" --packTitle Tupi --icon client/native/Talkeando.Client/assets/tupi.ico --framework webview2 --releaseNotes release/release-notes.md
          }

          # Velopack scopes Setup.exe by channel/RID. Keep one stable alias as
          # well: the final legacy bridge uses this URL to migrate an old Inno
          # installation to Velopack.
          $channelSetup = Join-Path release/velopack "$env:PACK_ID-${{ steps.release.outputs.velopack_channel }}-Setup.exe"
          if (-not (Test-Path -LiteralPath $channelSetup)) { throw "Velopack did not produce the expected installer: $channelSetup" }
          Copy-Item -LiteralPath $channelSetup -Destination (Join-Path release/velopack "$env:PACK_ID-Setup.exe") -Force

      - name: Write checksums for release artifacts
        shell: pwsh
        run: |
          # The previous feed is restored before packaging to generate delta
          # packages, so SHA256SUMS.txt can already exist. Do not hash that
          # file while overwriting it: Windows then raises a sharing violation.
          $directory = (Resolve-Path release/velopack).Path
          $checksums = Join-Path $directory 'SHA256SUMS.txt'
          $temporary = Join-Path $directory 'SHA256SUMS.txt.tmp'
          Remove-Item -LiteralPath $temporary -Force -ErrorAction SilentlyContinue
          Get-ChildItem $directory -File |
            Where-Object { $_.Name -notin @('SHA256SUMS.txt', 'SHA256SUMS.txt.tmp') } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), $_.Path.Substring($directory.Length + 1) } |
            Set-Content -LiteralPath $temporary -NoNewline
          Move-Item -LiteralPath $temporary -Destination $checksums -Force

      - name: Publish immutable update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:UPDATE_FEED_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:UPDATE_FEED_TAG --title 'Tupi update feed (machine managed)' --notes 'Do not install assets from this release manually.' --prerelease
          }
          gh release upload $env:UPDATE_FEED_TAG release/velopack/* --clobber

      - name: Create human-facing GitHub release without changing legacy latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.release.outputs.version }}'
          $notes = "Tupi $tag (${{ steps.release.outputs.channel }}).`n`nThis release is delivered automatically to Velopack clients. The legacy v0.1.999 bridge intentionally remains the GitHub latest release for old clients."
          $isPreRelease = '${{ steps.release.outputs.channel }}' -eq 'beta'
          # vpk includes the channel/RID in the setup filename (for example
          # `Tupi.Client-win-x64-beta-Setup.exe`), so never assume a bare
          # `<packId>-Setup.exe` name here.
          $setup = Join-Path release/velopack "$env:PACK_ID-${{ steps.release.outputs.velopack_channel }}-Setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Velopack did not produce the expected installer: $setup" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            # A rerun can happen after the release was created but before the
            # job completed. Replace its generated assets rather than failing
            # solely because the tag already exists.
            gh release upload $tag $setup release/velopack/SHA256SUMS.txt --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not refresh assets for $tag." }
            if ($isPreRelease) {
              gh release edit $tag --title "Tupi $tag" --notes $notes --latest=false --prerelease
            } else {
              gh release edit $tag --title "Tupi $tag" --notes $notes --latest=false
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not refresh metadata for $tag." }
          } else {
            if ($isPreRelease) {
              gh release create $tag $setup release/velopack/SHA256SUMS.txt --title "Tupi $tag" --notes $notes --latest=false --prerelease
            } else {
              gh release create $tag $setup release/velopack/SHA256SUMS.txt --title "Tupi $tag" --notes $notes --latest=false
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not create $tag." }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Tupi-${{ steps.release.outputs.version }}-${{ steps.release.outputs.channel }}
          path: release/velopack
          if-no-files-found: error
